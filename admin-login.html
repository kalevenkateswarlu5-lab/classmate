<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="style.css" rel="stylesheet"><title>ClassMate – Admin login</title></head>
<body class="auth-body" data-role="admin"><div class="auth-card fade-in">
<a href="index.html" class="brand dark"><i class="bi bi-mortarboard-fill"></i> ClassMate</a>
<h3 class="mt-3">Admin login</h3><p class="text-muted">Sign in to your classroom.</p>
<form id="loginForm" novalidate>
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required minlength="6"><div class="invalid-feedback">Enter your password.</div></div>
<button class="btn btn-primary w-100" type="submit">Sign in</button></form>
<p class="small text-muted mt-3 mb-0"><a href="index.html">← Back to home</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/login.js"></script></body></html>
