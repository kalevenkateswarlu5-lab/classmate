<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><title>ClassMate – Student signup</title></head>
<body class="auth-body" data-role="student"><div class="auth-card fade-in">
<a href="index.html" class="brand dark"><i class="bi bi-mortarboard-fill"></i> ClassMate</a>
<h3 class="mt-3">Create your account</h3><p class="text-muted">Join your class in a minute.</p>
<form id="signupForm" novalidate>
<div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" required><div class="invalid-feedback">Required</div></div>
<div class="mb-3"><label class="form-label">Roll number</label><input name="rollNo" class="form-control" required><div class="invalid-feedback">Required</div></div>
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required minlength="6"><div class="invalid-feedback">At least 6 characters.</div></div>
<div class="mb-3"><label class="form-label">Class</label><select name="classId" class="form-select" required><option value="">Loading classes…</option></select><div class="invalid-feedback">Pick your class.</div></div>
<button class="btn btn-primary w-100" type="submit">Create account</button></form>
<p class="small mt-3 mb-0">Already registered? <a href="student-login.html">Sign in</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/login.js"></script></body></html>
